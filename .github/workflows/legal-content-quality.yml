name: Legal content quality

on:
  pull_request:
    paths:
      - "content/blog/**/*.md"
      - "automation/**"
      - ".github/workflows/legal-content-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Legal OS v1 content
        run: python3 automation/validate_content.py
